    --gold:    #f0c040;
    --pale:    #e8d8ff;
    --muted:   #a080c0;

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

    background: var(--gold);
    border-radius: 50%;
    animation: twinkle var(--d, 3s) var(--delay, 0s) infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: 0.1; transform: scale(0.8); }
    100% { opacity: 0.9; transform: scale(1.2); }
  }

  /* ── Wrapper ── */
  .game-wrap {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
    text-align: center;
  }

  /* ── Header ── */
  .site-title {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(1.4rem, 5vw, 2.4rem);
    font-weight: 700;
    color: var(--pink);
    text-shadow: 0 0 20px #ff3fa488;
    letter-spacing: 0.04em;
    line-height: 1.2;
    margin-bottom: 0.4rem;
  }
  .site-sub {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--muted);
    margin-bottom: 2.2rem;
  }

  /* ── Instruction ── */
  .instruction {
    font-size: 1rem;
    font-style: italic;
    color: var(--muted);
    line-height: 1.6;
    transition: opacity 0.4s, max-height 0.5s, margin 0.5s;
    max-height: 100px;
    overflow: hidden;
    margin-bottom: 2rem;
  }
  .instruction.hidden { opacity: 0; pointer-events: none; max-height: 0; margin-bottom: 0; }

  /* ── Card flip ── */
  .card-scene {
    perspective: 1200px;
    width: var(--card-w);
    height: var(--card-h);
    margin: 0 auto 2rem;
    cursor: pointer;
  }
  .card-scene:hover .card-inner:not(.flipped) {
    transform: rotateY(8deg) translateY(-6px);
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card-inner.flipped { transform: rotateY(180deg); }

  .card-face, .card-back {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 14px;
    overflow: hidden;
  }

  /* ── Card back: image ── */
  .card-back {
    border: 2px solid var(--purple);
    box-shadow: 0 0 30px #9b30ff44;
    background: var(--surface);
  }
  .card-back-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 12px;
  }
  /* Fallback if image fails */
  .card-back-fallback {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
  }
  .card-back-img.error + .card-back-fallback { display: flex; }
  .card-back-moon {
    font-size: 3.8rem;
    filter: drop-shadow(0 0 12px var(--purple));
    animation: glow 2.5s ease-in-out infinite alternate;
  }
  .card-back-text {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.58rem;
    letter-spacing: 0.18em;
    color: var(--purple);
    text-transform: uppercase;
  }
  .card-back-stars { font-size: 0.9rem; color: var(--gold); letter-spacing: 0.3em; }
  @keyframes glow {
    from { filter: drop-shadow(0 0 8px var(--purple)); }
    to   { filter: drop-shadow(0 0 22px var(--pink)); }
  }

  /* ── Card face: full artwork image ── */
  .card-face {
    background: #0d0020;
    border: 2px solid var(--gold);
    box-shadow: 0 0 30px #f0c04033;
    transform: rotateY(180deg);
  }
  .card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 12px;
  }

  /* ── Tap hint ── */
  .tap-hint {
    font-size: 0.82rem;
    color: var(--muted);
    font-style: italic;
    margin-top: -1rem;
    margin-bottom: 1.5rem;
    animation: pulse 2s ease-in-out infinite;
  }

  .tap-hint.hidden { display: none; }

  /* ── Card revealed label (appears after flip) ── */
  .card-revealed {
    margin-bottom: 1rem;
    transition: opacity 0.4s;
    opacity: 0;
    pointer-events: none;

  .revealed-suit {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.55rem;
    letter-spacing: 0.22em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.25rem;

  .revealed-name {
    font-family: 'Cinzel Decorative', serif;

  .revealed-character {

    font-size: 0.85rem;

  /* ── Meaning reveal ── */
  .meaning-wrap {
    overflow: hidden;

    transition: max-height 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s;
    opacity: 0;
    margin-bottom: 1rem;
  }
  .meaning-wrap.open { max-height: 600px; opacity: 1; }

  .meaning-box {
    background: var(--surface);
    border: 1px solid #5a2080;
    border-radius: 10px;
    padding: 1.4rem 1.6rem;
    text-align: left;
    position: relative;
  }
  .meaning-label {
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--pink);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  .meaning-keyword {
    font-size: 0.78rem;

    font-style: italic;
    margin-bottom: 0.9rem;
    line-height: 1.5;

  .meaning-text {
    font-size: 1rem;
    line-height: 1.75;
    color: var(--pale);
    font-style: italic;
  }
  .meaning-corner {
    position: absolute;
    color: var(--gold);
    font-size: 0.9rem;
    opacity: 0.4;
  }
  .meaning-corner.tl { top: 6px; left: 8px; }
  .meaning-corner.tr { top: 6px; right: 8px; }
  .meaning-corner.bl { bottom: 6px; left: 8px; }
  .meaning-corner.br { bottom: 6px; right: 8px; }

    font-family: 'Cinzel Decorative', serif;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    padding: 0.7rem 1.8rem;

    border: none;

    text-transform: uppercase;
    display: inline-block;
    margin: 0.4rem;

  .btn-reveal {
    background: var(--pink);
    color: #fff;
    box-shadow: 0 0 18px #ff3fa466;
  }
  .btn-reveal:hover { box-shadow: 0 0 28px #ff3fa499; transform: translateY(-2px); }
  .btn-reveal.hidden { display: none; }

  .btn-again {
    background: transparent;
    color: var(--purple);
    border: 1px solid var(--purple);

  .btn-again:hover { box-shadow: 0 0 22px #9b30ff66; transform: translateY(-2px); }

  .btn-share {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    box-shadow: 0 0 12px #f0c04033;
  }
  .btn-share:hover { box-shadow: 0 0 22px #f0c04066; transform: translateY(-2px); }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--purple);
    color: #fff;
    font-family: 'Cinzel Decorative', serif;
    font-size: 0.62rem;

  .blink { animation: blink 1.1s step-start infinite; color: var(--gold); }
  @keyframes blink { 50% { opacity: 0; } }

  .game-footer { margin-top: 3rem; font-size: 0.75rem; color: #5a3070; font-style: italic; }

  @media (max-width: 400px) {
    :root { --card-w: 180px; --card-h: 280px; }
  }
</style>

// ============================================================
//  STATE
// ============================================================
let currentCard = null;
let hasFlipped   = false;

// ============================================================
//  INIT — check for shared card in URL first
// ============================================================
function init() {
  generateStars();
  document.getElementById('cardBackImg').src = BASE_URL + 'card_back.webp';

  const params  = new URLSearchParams(window.location.search);
  const slug    = params.get('card');
  const shared  = slug && CARDS.find(c => c.image.replace('.webp', '') === slug);

  if (shared) {
    currentCard = shared;
    loadCard();
    autoReveal();   // land with card flipped + reading open
  } else {
    pickCard();
  }
}

function generateStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --d:${(Math.random()*3+2).toFixed(1)}s;
      --delay:-${(Math.random()*4).toFixed(1)}s;
    `;
    container.appendChild(s);
  }
}

// ============================================================
//  PICK (random) + LOAD (populate DOM)
// ============================================================
function pickCard() {
  currentCard = CARDS[Math.floor(Math.random() * CARDS.length)];
  // Update URL silently so the card is shareable immediately
  history.replaceState(null, '', '?card=' + currentCard.image.replace('.webp', ''));
  loadCard();
}

function loadCard() {
  document.getElementById('cardImg').src        = BASE_URL + currentCard.image;
  document.getElementById('cardImg').alt        = currentCard.name;
  document.getElementById('revealedSuit').textContent  = currentCard.suit;
  document.getElementById('revealedName').textContent  = currentCard.name;
  const charEl = document.getElementById('revealedCharacter');
  charEl.textContent   = currentCard.character || '';
  charEl.style.display = currentCard.character ? 'block' : 'none';
  document.getElementById('meaningKeyword').textContent = currentCard.keyword;
  document.getElementById('meaningText').textContent    = currentCard.meaning;
}

// ============================================================
//  FLIP (user-triggered)
// ============================================================
function flipCard() {
  if (hasFlipped) return;
  hasFlipped = true;
  document.getElementById('cardInner').classList.add('flipped');
  document.getElementById('instruction').classList.add('hidden');
  document.getElementById('tapHint').classList.add('hidden');
  document.getElementById('cardScene').style.cursor = 'default';
  setTimeout(() => {
    document.getElementById('cardRevealed').classList.add('show');
    document.getElementById('revealBtn').classList.remove('hidden');
  }, 700);
}

// ============================================================
//  AUTO-REVEAL (for shared links — skip animation)
// ============================================================
function autoReveal() {
  hasFlipped = true;
  const inner = document.getElementById('cardInner');
  inner.style.transition = 'none';
  inner.classList.add('flipped');
  // Re-enable transition after paint
  requestAnimationFrame(() => { inner.style.transition = ''; });

  document.getElementById('instruction').classList.add('hidden');
  document.getElementById('tapHint').classList.add('hidden');
  document.getElementById('cardScene').style.cursor = 'default';
  document.getElementById('cardRevealed').classList.add('show');
  document.getElementById('meaningWrap').classList.add('open');
  document.getElementById('shareBtn').classList.remove('hidden');
  document.getElementById('againBtn').classList.remove('hidden');
}

// ============================================================
//  REVEAL MEANING
// ============================================================
function revealMeaning() {
  document.getElementById('revealBtn').classList.add('hidden');
  document.getElementById('meaningWrap').classList.add('open');
  setTimeout(() => {
    document.getElementById('shareBtn').classList.remove('hidden');
    document.getElementById('againBtn').classList.remove('hidden');
  }, 600);
}

// ============================================================
//  SHARE
// ============================================================
async function shareReading() {
  const btn   = document.getElementById('shareBtn');
  const url   = window.location.href;
  const title = `I drew ${currentCard.name} · The Witchy Girls Tarot`;
  const text  = currentCard.meaning;

  // ── Try sharing with image file (mobile) ──
  if (navigator.share && navigator.canShare) {
    btn.textContent = '✦ Preparing... ✦';
    btn.disabled = true;

    try {
      const response = await fetch(BASE_URL + currentCard.image);
      const blob     = await response.blob();
      const file     = new File([blob], currentCard.image, { type: blob.type });

      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ title, text, url, files: [file] });
      } else {
        // Device supports share but not file — share without image
        await navigator.share({ title, text, url });
      }
    } catch (err) {
      if (err.name !== 'AbortError') {
        // Fetch or share failed — fall back to URL only
        try { await navigator.share({ title, text, url }); } catch (_) {}
      }
    } finally {
      btn.textContent = '✦ Share This Reading ✦';
      btn.disabled = false;
    }
    return;
  }

  // ── Desktop fallback: copy link to clipboard ──
  try {
    await navigator.clipboard.writeText(url);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  } catch (_) {
    prompt('Copy this link:', url);
  }
}

// ============================================================
//  RESET
// ============================================================
function resetGame() {
  hasFlipped = false;

  const inner = document.getElementById('cardInner');
  inner.style.transition = 'none';
  inner.classList.remove('flipped');

  document.getElementById('meaningWrap').classList.remove('open');
  document.getElementById('cardRevealed').classList.remove('show');
  document.getElementById('againBtn').classList.add('hidden');
  document.getElementById('shareBtn').classList.add('hidden');
  document.getElementById('revealBtn').classList.add('hidden');

  setTimeout(() => {
    inner.style.transition = '';
    pickCard();   // also updates URL to new card slug
    document.getElementById('instruction').classList.remove('hidden');
    document.getElementById('tapHint').classList.remove('hidden');
    document.getElementById('cardScene').style.cursor = 'pointer';
  }, 50);
}

init();
</script>
